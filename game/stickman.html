<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>火柴人極限格鬥 - 完全版</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background: #0a0a0f;
    color: #fff;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #game-wrapper {
    position: relative;
    width: 960px;
    max-width: 100vw;
    height: 540px;
    max-height: 100vh;
    background: radial-gradient(circle at center, #1b1c2e 0%, #08080c 100%);
    box-shadow: 0 15px 40px rgba(0,0,0,0.9);
    border: 1px solid rgba(255,255,255,0.1);
    overflow: hidden;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 16px 24px;
  }
  .top-hud {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    width: 100%;
  }
  .player-box { width: 42%; }
  .name-row {
    display: flex;
    justify-content: space-between;
    font-weight: 900;
    font-size: 16px;
    letter-spacing: 1px;
    margin-bottom: 4px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }
  .p1-color { color: #00f0ff; }
  .p2-color { color: #ff2a6d; }
  .bar-shell {
    background: rgba(0,0,0,0.6);
    height: 22px;
    border-radius: 4px;
    padding: 2px;
    border: 1px solid rgba(255,255,255,0.25);
    box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
  }
  .hp-bar {
    height: 100%;
    width: 100%;
    border-radius: 2px;
    transition: width 0.08s ease-out;
  }
  .p1-hp { background: linear-gradient(90deg, #0077b6, #00f0ff); box-shadow: 0 0 8px #00f0ff; }
  .p2-hp { background: linear-gradient(90deg, #ff2a6d, #ff6b8b); box-shadow: 0 0 8px #ff2a6d; float: right; }
  .energy-shell {
    margin-top: 5px;
    background: rgba(0,0,0,0.5);
    height: 8px;
    border-radius: 2px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .energy-fill {
    height: 100%;
    width: 0%;
    background: #ffe600;
    box-shadow: 0 0 6px #ffe600;
  }
  .timer-center {
    font-size: 32px;
    font-weight: 900;
    color: #fff;
    background: rgba(0,0,0,0.4);
    padding: 2px 14px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  #center-banner {
    position: absolute;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 56px;
    font-weight: 900;
    font-style: italic;
    color: #fff;
    text-shadow: 0 0 25px rgba(255,255,255,0.9), 0 0 40px #ff2a6d;
    display: none;
    pointer-events: none;
    letter-spacing: 4px;
  }
  .menu-screen {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(8, 8, 12, 0.88);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
    pointer-events: auto;
    z-index: 10;
  }
  .menu-screen h1 {
    font-size: 42px;
    letter-spacing: 3px;
    background: linear-gradient(45deg, #00f0ff, #ff2a6d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .menu-btn {
    padding: 12px 32px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 25px;
    cursor: pointer;
    min-width: 220px;
    transition: all 0.2s ease;
  }
  .menu-btn:hover {
    background: rgba(255,255,255,0.2);
    border-color: #00f0ff;
    transform: scale(1.04);
  }
  .menu-btn.active {
    background: #00f0ff;
    color: #000;
    border-color: #00f0ff;
    box-shadow: 0 0 15px rgba(0,240,255,0.6);
  }

  /* 行動裝置觸控鍵 */
  #touch-controls {
    display: none;
    position: absolute;
    bottom: 12px;
    left: 0;
    width: 100%;
    padding: 0 16px;
    justify-content: space-between;
    pointer-events: auto;
  }
  .touch-cluster { display: flex; gap: 8px; }
  .tbtn {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    color: #fff;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  .tbtn:active { background: rgba(0,240,255,0.5); }
  @media (pointer: coarse) {
    #touch-controls { display: flex; }
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <canvas id="stage" width="960" height="540"></canvas>

  <div class="ui-layer">
    <div class="top-hud">
      <div class="player-box">
        <div class="name-row p1-color">
          <span id="p1-name-tag">P1 (SHADOW)</span>
          <span id="p1-combo"></span>
        </div>
        <div class="bar-shell"><div id="p1-hp" class="hp-bar p1-hp"></div></div>
        <div class="energy-shell"><div id="p1-en" class="energy-fill"></div></div>
      </div>

      <div id="game-timer" class="timer-center">99</div>

      <div class="player-box">
        <div class="name-row p2-color">
          <span id="p2-combo"></span>
          <span id="p2-name-tag">AI (NORMAL)</span>
        </div>
        <div class="bar-shell"><div id="p2-hp" class="hp-bar p2-hp"></div></div>
        <div class="energy-shell"><div id="p2-en" class="energy-fill" style="float: right;"></div></div>
      </div>
    </div>

    <div id="center-banner">K.O.</div>

    <!-- 行動裝置按鍵 -->
    <div id="touch-controls">
      <div class="touch-cluster">
        <button class="tbtn" id="btn-left">←</button>
        <button class="tbtn" id="btn-up">↑</button>
        <button class="tbtn" id="btn-down">↓</button>
        <button class="tbtn" id="btn-right">→</button>
      </div>
      <div class="touch-cluster">
        <button class="tbtn" id="btn-j" style="background: rgba(0,240,255,0.25)">J</button>
        <button class="tbtn" id="btn-k" style="background: rgba(255,42,109,0.25)">K</button>
        <button class="tbtn" id="btn-u" style="background: rgba(255,230,0,0.25)">U</button>
        <button class="tbtn" id="btn-i" style="background: rgba(180,0,255,0.25)">I</button>
      </div>
    </div>
  </div>

  <!-- 主選單 -->
  <div id="main-menu" class="menu-screen">
    <h1>火柴人極限格鬥</h1>
    <button class="menu-btn" onclick="startMode('ai')">單人對抗 AI</button>
    <button class="menu-btn" onclick="startMode('pvp')">雙人本地對決 (1P vs 2P)</button>
    <div style="display: flex; gap: 8px; margin-top: 6px;">
      <button class="menu-btn active" id="diff-easy" onclick="setDiff('easy')">簡單</button>
      <button class="menu-btn" id="diff-normal" onclick="setDiff('normal')">普通</button>
      <button class="menu-btn" id="diff-hard" onclick="setDiff('hard')">困難</button>
      <button class="menu-btn" id="diff-boss" onclick="setDiff('boss')">修羅</button>
    </div>
  </div>

  <!-- 結算選單 -->
  <div id="pause-menu" class="menu-screen" style="display: none;">
    <h1 id="result-title">VICTORY</h1>
    <button class="menu-btn active" onclick="restartMatch()">再戰一局</button>
    <button class="menu-btn" onclick="returnToMenu()">返回主選單</button>
  </div>
</div>

<div style="font-size: 13px; color: #777; margin-top: 10px; text-align: center; line-height: 1.6;">
  <b>1P 操作：</b> [A/D] 移動 | [W] 跳躍 | [S] 防禦 | [J] 輕拳 | [K] 重踢浮空 | [U] 氣功波 (氣力 25) | [I] 升龍奧義 (氣力 50)<br>
  <b>2P 操作：</b> [←/→] 移動 | [↑] 跳躍 | [↓] 防禦 | [1] 輕拳 | [2] 重踢浮空 | [4] 氣功波 | [5] 升龍奧義
</div>

<script>
// Web Audio 音效產生器
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
function playSound(name) {
  try {
    if (!actx) actx = new AudioCtx();
    const t = actx.currentTime;
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.connect(gain);
    gain.connect(actx.destination);

    if (name === 'punch') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(160, t);
      osc.frequency.exponentialRampToValueAtTime(40, t + 0.08);
      gain.gain.setValueAtTime(0.3, t);
      gain.gain.linearRampToValueAtTime(0.01, t + 0.08);
      osc.start(t); osc.stop(t + 0.08);
    } else if (name === 'kick') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(100, t);
      osc.frequency.exponentialRampToValueAtTime(20, t + 0.15);
      gain.gain.setValueAtTime(0.5, t);
      gain.gain.linearRampToValueAtTime(0.01, t + 0.15);
      osc.start(t); osc.stop(t + 0.15);
    } else if (name === 'blast') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, t);
      osc.frequency.exponentialRampToValueAtTime(100, t + 0.3);
      gain.gain.setValueAtTime(0.4, t);
      gain.gain.linearRampToValueAtTime(0.01, t + 0.3);
      osc.start(t); osc.stop(t + 0.3);
    } else if (name === 'dragon') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, t);
      osc.frequency.linearRampToValueAtTime(700, t + 0.3);
      gain.gain.setValueAtTime(0.4, t);
      gain.gain.linearRampToValueAtTime(0.01, t + 0.35);
      osc.start(t); osc.stop(t + 0.35);
    } else if (name === 'ko') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(100, t);
      osc.frequency.exponentialRampToValueAtTime(20, t + 0.8);
      gain.gain.setValueAtTime(0.6, t);
      gain.gain.linearRampToValueAtTime(0.01, t + 0.8);
      osc.start(t); osc.stop(t + 0.8);
    }
  } catch(e) {}
}

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const GROUND = 440;

let gameMode = 'ai'; // 'ai' or 'pvp'
let aiDifficulty = 'easy'; // easy, normal, hard, boss
let isRunning = false;
let slowMoTime = 0;
let shakeTime = 0;
let matchTimer = 99;
let timerInterval = null;

let particles = [];
let projectiles = [];

class Fighter {
  constructor(x, color, isP2 = false) {
    this.startX = x;
    this.x = x;
    this.y = GROUND;
    this.vx = 0;
    this.vy = 0;
    this.color = color;
    this.isP2 = isP2;
    this.facing = isP2 ? -1 : 1;
    this.hp = 100;
    this.energy = 0;
    this.isGrounded = true;
    this.state = 'idle'; // idle, run, jump, punch, kick, dragon, block, hit, juggle
    this.stateTimer = 0;
    this.comboCount = 0;
    this.comboTimer = 0;

    // 動態飄動頭帶節點 (3個連鎖點)
    this.bandNodes = [{x, y: GROUND - 85}, {x, y: GROUND - 85}, {x, y: GROUND - 85}];
  }

  reset() {
    this.x = this.startX;
    this.y = GROUND;
    this.vx = 0;
    this.vy = 0;
    this.hp = 100;
    this.energy = 20;
    this.isGrounded = true;
    this.state = 'idle';
    this.stateTimer = 0;
    this.comboCount = 0;
    this.comboTimer = 0;
    this.facing = this.isP2 ? -1 : 1;
  }

  update(opponent) {
    // 重力運算 (浮空判定)
    if (!this.isGrounded) {
      this.vy += 0.85;
      this.y += this.vy;
      if (this.y >= GROUND) {
        this.y = GROUND;
        this.vy = 0;
        this.isGrounded = true;
        if (this.state === 'juggle' || this.state === 'dragon') this.state = 'idle';
      }
    }

    this.x += this.vx;
    if (this.x < 40) this.x = 40;
    if (this.x > canvas.width - 40) this.x = canvas.width - 40;

    // 自動面朝對手 (攻擊中不變向)
    if (['idle', 'run', 'block'].includes(this.state)) {
      this.facing = this.x < opponent.x ? 1 : -1;
    }

    // 氣力自動回填
    if (this.energy < 100) this.energy += 0.08;

    // Combo 退減
    if (this.comboTimer > 0) {
      this.comboTimer--;
      if (this.comboTimer <= 0) this.comboCount = 0;
    }

    // 狀態計時退減
    if (this.stateTimer > 0) {
      this.stateTimer--;
      if (this.stateTimer <= 0 && !['idle', 'block'].includes(this.state)) {
        this.state = 'idle';
      }
    }

    // 動態頭帶物理擺動
    const headX = this.x;
    const headY = this.y - 82;
    this.bandNodes[0] = { x: headX - this.facing * 10, y: headY + 3 };
    for (let i = 1; i < this.bandNodes.length; i++) {
      const prev = this.bandNodes[i - 1];
      const curr = this.bandNodes[i];
      const targetX = prev.x - this.facing * 9 - this.vx * 1.5;
      const targetY = prev.y + 2 + Math.sin(Date.now() * 0.01 + i) * 3;
      curr.x += (targetX - curr.x) * 0.4;
      curr.y += (targetY - curr.y) * 0.4;
    }

    if (this.isP2 && gameMode === 'ai') {
      this.updateAI(opponent);
    }
  }

  attack(type) {
    if (!['idle', 'run'].includes(this.state)) return;

    if (type === 'punch') {
      this.state = 'punch';
      this.stateTimer = 14;
      applyHit(this, 55, 7, false, 'punch');
    } else if (type === 'kick') {
      this.state = 'kick';
      this.stateTimer = 20;
      applyHit(this, 75, 12, true, 'kick'); // 重踢帶浮空效果
    } else if (type === 'blast' && this.energy >= 25) {
      this.energy -= 25;
      this.state = 'punch';
      this.stateTimer = 18;
      projectiles.push({
        x: this.x + this.facing * 35,
        y: this.y - 50,
        vx: this.facing * 13,
        owner: this,
        color: this.color
      });
      playSound('blast');
    } else if (type === 'dragon' && this.energy >= 50 && this.isGrounded) {
      this.energy -= 50;
      this.state = 'dragon';
      this.vy = -16;
      this.vx = this.facing * 6;
      this.isGrounded = false;
      this.stateTimer = 32;
      playSound('dragon');
      applyHit(this, 65, 24, true, 'kick');
    }
  }

  updateAI(p1) {
    if (!isRunning || this.state === 'hit' || this.state === 'juggle') return;
    const dist = Math.abs(this.x - p1.x);

    let reactRate = 0.03;
    let aggression = 0.4;
    if (aiDifficulty === 'normal') { reactRate = 0.07; aggression = 0.6; }
    if (aiDifficulty === 'hard') { reactRate = 0.12; aggression = 0.75; }
    if (aiDifficulty === 'boss') { reactRate = 0.22; aggression = 0.9; }

    // 修羅 / 困難 AI：對方出拳時極高機率瞬間格擋
    if ((aiDifficulty === 'hard' || aiDifficulty === 'boss') && ['punch', 'kick', 'dragon'].includes(p1.state) && dist < 80) {
      if (Math.random() < 0.8) {
        this.state = 'block';
        this.vx = 0;
        return;
      }
    }

    if (Math.random() < reactRate) {
      if (dist > 160) {
        this.vx = this.facing * (aiDifficulty === 'boss' ? 5.5 : 3.5);
        this.state = 'run';
      } else {
        this.vx = 0;
        const r = Math.random();
        if (r < aggression * 0.4) this.attack('punch');
        else if (r < aggression * 0.75) this.attack('kick');
        else if (r < 0.9 && this.energy >= 25) this.attack('blast');
        else if (this.energy >= 50) this.attack('dragon');
      }
    }
    if (Math.random() < 0.05 && this.state === 'run') this.vx = 0;
  }

  draw() {
    ctx.save();
    ctx.strokeStyle = this.color;
    ctx.fillStyle = this.color;
    ctx.lineWidth = 4.5;
    ctx.lineCap = 'round';

    const dir = this.facing;
    const px = this.x;
    const py = this.y;

    const headX = px;
    const headY = py - 80;
    const bodyBotX = px;
    const bodyBotY = py - 40;

    let lHandX = px - dir * 14, lHandY = py - 52;
    let rHandX = px + dir * 16, rHandY = py - 52;
    let lFootX = px - 18, lFootY = py;
    let rFootX = px + 18, rFootY = py;

    if (this.state === 'run') {
      const swing = Math.sin(Date.now() * 0.02) * 20;
      rHandX = px + swing;
      lHandX = px - swing;
      rFootX = px - swing;
      lFootX = px + swing;
    } else if (this.state === 'punch') {
      rHandX = px + dir * 55;
      rHandY = py - 58;
    } else if (this.state === 'kick') {
      rFootX = px + dir * 55;
      rFootY = py - 50;
    } else if (this.state === 'dragon') {
      rHandX = px + dir * 12;
      rHandY = py - 105;
      lFootX = px - dir * 10;
      rFootX = px + dir * 15;
    } else if (this.state === 'block') {
      lHandX = px + dir * 20; lHandY = py - 70;
      rHandX = px + dir * 20; rHandY = py - 50;
      // 能量護盾
      ctx.beginPath();
      ctx.arc(px + dir * 28, py - 55, 34, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)';
      ctx.stroke();
      ctx.strokeStyle = this.color;
    } else if (this.state === 'juggle') {
      // 浮空姿態
      lHandX = px - dir * 30; lHandY = py - 75;
      rHandX = px + dir * 30; rHandY = py - 75;
      lFootX = px - 25; lFootY = py - 15;
      rFootX = px + 25; rFootY = py - 15;
    }

    // 繪製骨架
    ctx.beginPath();
    ctx.arc(headX, headY, 13, 0, Math.PI * 2); // 頭
    ctx.moveTo(headX, headY + 13);
    ctx.lineTo(bodyBotX, bodyBotY);            // 脊椎
    ctx.moveTo(headX, headY + 20); ctx.lineTo(lHandX, lHandY); // 手臂
    ctx.moveTo(headX, headY + 20); ctx.lineTo(rHandX, rHandY);
    ctx.moveTo(bodyBotX, bodyBotY); ctx.lineTo(lFootX, lFootY); // 腿部
    ctx.moveTo(bodyBotX, bodyBotY); ctx.lineTo(rFootX, rFootY);
    ctx.stroke();

    // 繪製飄帶
    ctx.beginPath();
    ctx.moveTo(this.bandNodes[0].x, this.bandNodes[0].y);
    for (let i = 1; i < this.bandNodes.length; i++) {
      ctx.lineTo(this.bandNodes[i].x, this.bandNodes[i].y);
    }
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.restore();
  }
}

const p1 = new Fighter(240, '#00f0ff', false);
const p2 = new Fighter(720, '#ff2a6d', true);

function applyHit(attacker, reach, dmg, canJuggle, sound) {
  const target = attacker === p1 ? p2 : p1;
  const dist = Math.abs(attacker.x - target.x);

  if (dist < reach && Math.sign(target.x - attacker.x) === attacker.facing) {
    let finalDmg = dmg;
    if (target.state === 'block') {
      finalDmg *= 0.15;
      attacker.energy += 3;
    } else {
      attacker.comboCount++;
      attacker.comboTimer = 90;
      attacker.energy = Math.min(100, attacker.energy + 12);

      if (canJuggle) {
        target.state = 'juggle';
        target.vy = -12;
        target.vx = attacker.facing * 5;
        target.isGrounded = false;
      } else {
        target.state = 'hit';
        target.stateTimer = 12;
        target.vx = attacker.facing * 4;
      }
    }

    target.hp = Math.max(0, target.hp - finalDmg);
    shakeTime = 8;
    playSound(sound);

    // 火花粒子效果
    for (let i = 0; i < 12; i++) {
      particles.push({
        x: target.x,
        y: target.y - 50,
        vx: (Math.random() - 0.5) * 10,
        vy: (Math.random() - 0.5) * 10,
        life: 20,
        color: attacker.color
      });
    }

    // 終結判定 (慢動作啟動)
    if (target.hp <= 0 && isRunning) {
      triggerKO(attacker);
    }
  }
}

function triggerKO(winner) {
  isRunning = false;
  slowMoTime = 90; // 慢動作停留 90 幀
  shakeTime = 20;
  playSound('ko');

  const banner = document.getElementById('center-banner');
  banner.innerText = 'K.O.';
  banner.style.display = 'block';

  clearInterval(timerInterval);

  setTimeout(() => {
    banner.style.display = 'none';
    document.getElementById('pause-menu').style.display = 'flex';
    document.getElementById('result-title').innerText = (winner === p1 ? 'PLAYER 1' : (gameMode === 'ai' ? 'AI' : 'PLAYER 2')) + ' 勝出!';
  }, 2200);
}

// 鍵盤輸入事件
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (!isRunning) return;

  // 1P 招式
  if (e.key.toLowerCase() === 'j') p1.attack('punch');
  if (e.key.toLowerCase() === 'k') p1.attack('kick');
  if (e.key.toLowerCase() === 'u') p1.attack('blast');
  if (e.key.toLowerCase() === 'i') p1.attack('dragon');

  // 2P 招式 (雙人模式)
  if (gameMode === 'pvp') {
    if (e.key === '1') p2.attack('punch');
    if (e.key === '2') p2.attack('kick');
    if (e.key === '4') p2.attack('blast');
    if (e.key === '5') p2.attack('dragon');
  }
});
window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
  if (['a', 'd'].includes(e.key.toLowerCase()) && p1.state === 'run') p1.state = 'idle';
  if (e.key.toLowerCase() === 's' && p1.state === 'block') p1.state = 'idle';

  if (gameMode === 'pvp') {
    if (['arrowleft', 'arrowright'].includes(e.key.toLowerCase()) && p2.state === 'run') p2.state = 'idle';
    if (e.key.toLowerCase() === 'arrowdown' && p2.state === 'block') p2.state = 'idle';
  }
});

// 手機觸控按鈕綁定
function bindTouch(id, onStart, onEnd) {
  const btn = document.getElementById(id);
  btn.addEventListener('touchstart', e => { e.preventDefault(); onStart(); });
  btn.addEventListener('touchend', e => { e.preventDefault(); onEnd(); });
}
bindTouch('btn-left', () => { keys['a'] = true; }, () => { keys['a'] = false; p1.state = 'idle'; });
bindTouch('btn-right', () => { keys['d'] = true; }, () => { keys['d'] = false; p1.state = 'idle'; });
bindTouch('btn-up', () => { if (p1.isGrounded) { p1.vy = -14; p1.isGrounded = false; } }, () => {});
bindTouch('btn-down', () => { keys['s'] = true; }, () => { keys['s'] = false; p1.state = 'idle'; });
bindTouch('btn-j', () => p1.attack('punch'), () => {});
bindTouch('btn-k', () => p1.attack('kick'), () => {});
bindTouch('btn-u', () => p1.attack('blast'), () => {});
bindTouch('btn-i', () => p1.attack('dragon'), () => {});

function processInputs() {
  if (!isRunning) return;

  // 1P 行動
  if (p1.state !== 'hit' && p1.state !== 'juggle') {
    if (keys['s']) {
      p1.state = 'block';
      p1.vx = 0;
    } else if (keys['a']) {
      p1.vx = -4.5;
      p1.state = 'run';
    } else if (keys['d']) {
      p1.vx = 4.5;
      p1.state = 'run';
    } else if (p1.isGrounded && p1.state === 'run') {
      p1.vx = 0;
      p1.state = 'idle';
    }
    if (keys['w'] && p1.isGrounded) {
      p1.vy = -14;
      p1.isGrounded = false;
    }
  }

  // 2P 行動 (PVP 模式)
  if (gameMode === 'pvp' && p2.state !== 'hit' && p2.state !== 'juggle') {
    if (keys['arrowdown']) {
      p2.state = 'block';
      p2.vx = 0;
    } else if (keys['arrowleft']) {
      p2.vx = -4.5;
      p2.state = 'run';
    } else if (keys['arrowright']) {
      p2.vx = 4.5;
      p2.state = 'run';
    } else if (p2.isGrounded && p2.state === 'run') {
      p2.vx = 0;
      p2.state = 'idle';
    }
    if (keys['arrowup'] && p2.isGrounded) {
      p2.vy = -14;
      p2.isGrounded = false;
    }
  }
}

// 難度選擇
function setDiff(level) {
  aiDifficulty = level;
  ['easy', 'normal', 'hard', 'boss'].forEach(l => {
    document.getElementById('diff-' + l).classList.remove('active');
  });
  document.getElementById('diff-' + level).classList.add('active');
}

function startMode(mode) {
  gameMode = mode;
  document.getElementById('main-menu').style.display = 'none';
  document.getElementById('p2-name-tag').innerText = mode === 'ai' ? `AI (${aiDifficulty.toUpperCase()})` : 'P2 (FURY)';
  restartMatch();
}

function returnToMenu() {
  document.getElementById('pause-menu').style.display = 'none';
  document.getElementById('main-menu').style.display = 'flex';
}

function restartMatch() {
  p1.reset();
  p2.reset();
  projectiles = [];
  particles = [];
  matchTimer = 99;
  isRunning = true;
  slowMoTime = 0;
  document.getElementById('pause-menu').style.display = 'none';
  document.getElementById('center-banner').style.display = 'none';

  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (isRunning && matchTimer > 0) {
      matchTimer--;
      document.getElementById('game-timer').innerText = matchTimer;
      if (matchTimer <= 0) {
        triggerKO(p1.hp >= p2.hp ? p1 : p2);
      }
    }
  }, 1000);
}

// 主渲染迴圈
function gameLoop() {
  // 慢動作控制 (Slow-Mo 模式下降頻更新)
  let steps = 1;
  if (slowMoTime > 0) {
    slowMoTime--;
    if (slowMoTime % 3 !== 0) steps = 0; // 降低更新幀速
  }

  for (let s = 0; s < steps; s++) {
    processInputs();
    p1.update(p2);
    p2.update(p1);

    // 投射物飛行
    for (let i = projectiles.length - 1; i >= 0; i--) {
      const p = projectiles[i];
      p.x += p.vx;
      const target = p.owner === p1 ? p2 : p1;
      if (Math.abs(p.x - target.x) < 25 && Math.abs(p.y - (target.y - 45)) < 45) {
        applyHit(p.owner, 999, 14, false, 'kick');
        projectiles.splice(i, 1);
        continue;
      }
      if (p.x < 0 || p.x > canvas.width) projectiles.splice(i, 1);
    }

    // 微粒生命週期
    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i];
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.life--;
      if (pt.life <= 0) particles.splice(i, 1);
    }
  }

  // 畫面震動
  ctx.save();
  if (shakeTime > 0) {
    shakeTime--;
    ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 繪製格鬥台地面與背景網格
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
  ctx.lineWidth = 1;
  for (let x = 0; x < canvas.width; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  ctx.strokeStyle = '#333b5c';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(canvas.width, GROUND); ctx.stroke();

  // 繪製投射物 (氣功)
  projectiles.forEach(p => {
    ctx.save();
    ctx.beginPath();
    ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 15;
    ctx.fill();
    ctx.restore();
  });

  // 繪製擊打微粒
  particles.forEach(pt => {
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x, pt.y, 3.5, 3.5);
  });

  p1.draw();
  p2.draw();

  ctx.restore();

  // 更新 HUD 面板
  document.getElementById('p1-hp').style.width = p1.hp + '%';
  document.getElementById('p2-hp').style.width = p2.hp + '%';
  document.getElementById('p1-en').style.width = p1.energy + '%';
  document.getElementById('p2-en').style.width = p2.energy + '%';
  document.getElementById('p1-combo').innerText = p1.comboCount > 1 ? `${p1.comboCount} COMBO!` : '';
  document.getElementById('p2-combo').innerText = p2.comboCount > 1 ? `${p2.comboCount} COMBO!` : '';

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
