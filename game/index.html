<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的遊戲作品集</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f111a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    h1 { margin-bottom: 8px; font-size: 28px; }
    p { color: #888; margin-bottom: 30px; font-size: 14px; }
    .game-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 420px;
    }
    .game-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: #1a1d2e;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.2s ease;
    }
    .game-card:hover {
      background: #23273c;
      border-color: #00f0ff;
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0,240,255,0.2);
    }
    .tag { font-size: 12px; color: #00f0ff; font-weight: normal; }
  </style>
</head>
<body>

  <h1>🎮 我的 HTML5 遊戲作品集</h1>
  <p>點擊下方按鈕即可直接開始遊玩：</p>

  <div class="game-list">
    <a class="game-card" href="clash.html">
      <span>⚔️ 部落攻防戰</span>
      <span class="tag">策略塔防</span>
    </a>

    <a class="game-card" href="tower.html">
      <span>🛡️ 次元防線：終焉協奏</span>
      <span class="tag">動漫塔防</span>
    </a>

    <a class="game-card" href="stickman.html">
      <span>🥊 火柴人極限格鬥</span>
      <span class="tag">動作動作</span>
    </a>

    <a class="game-card" href="galgame.html">
      <span>🌸 青空下的約定</span>
      <span class="tag">文字冒險</span>
    </a>

    <!-- 如果原本資料夾裡的視覺小說也要能點進去 -->
    <a class="game-card" href="W6-視覺小說檔案/index.html">
      <span>📖 W6 視覺小說作業</span>
      <span class="tag">課堂作業</span>
    </a>
  </div>

</body>
</html>
